<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5d2ec"/>
      <stop offset="0.75" stop-color="#cfe9f5"/>
      <stop offset="1" stop-color="#e6f3f8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9fc4"/>
      <stop offset="1" stop-color="#3a77a0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6b9b0"/>
      <stop offset="1" stop-color="#cfd2c9"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="560" fill="url(#sky)"/>

  <!-- 大积云（动画电影里的那种） -->
  <g fill="#ffffff">
    <g opacity=".95">
      <ellipse cx="300" cy="180" rx="150" ry="58"/>
      <ellipse cx="410" cy="150" rx="120" ry="66"/>
      <ellipse cx="200" cy="200" rx="110" ry="46"/>
      <rect x="90" y="185" width="430" height="55" rx="27"/>
    </g>
    <g opacity=".9">
      <ellipse cx="1050" cy="110" rx="130" ry="48"/>
      <ellipse cx="1160" cy="86" rx="100" ry="54"/>
      <rect x="920" y="108" width="350" height="48" rx="24"/>
    </g>
    <g opacity=".75">
      <ellipse cx="620" cy="330" rx="90" ry="30"/>
      <ellipse cx="700" cy="315" rx="70" ry="34"/>
      <rect x="530" y="325" width="240" height="28" rx="14"/>
    </g>
  </g>

  <!-- 海 -->
  <rect y="520" width="1600" height="140" fill="url(#sea)"/>
  <g stroke="#bcdcec" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="M180 556h70M320 576h56M520 552h64M760 572h70M980 556h58M1180 574h66M1380 552h52"/>
  </g>
  <g fill="#ffffff">
    <path d="M1245 470 l7 26 h-14 z" opacity=".9"/>
    <path d="M1250 468 v22" stroke="#e8f4fa" stroke-width="3"/>
  </g>

  <!-- 左侧岩石坡 -->
  <path d="M0 900V430L150 470c40 30 40 90 10 130l-60 80 40 90-30 130z" fill="#8d9080"/>
  <path d="M0 900V470l110 40c30 24 28 76 6 110l-52 70 34 80-22 130z" fill="#777d6d"/>
  <g fill="#5e7a4d">
    <ellipse cx="60" cy="470" rx="52" ry="22"/>
    <ellipse cx="130" cy="500" rx="40" ry="16"/>
    <ellipse cx="40" cy="560" rx="34" ry="14"/>
  </g>

  <!-- 道路与斑马线 -->
  <rect y="640" width="1600" height="260" fill="url(#road)"/>
  <g fill="#f6f5ee" opacity=".9">
    <path d="M180 780l60-60h56l-60 60zM340 780l60-60h56l-60 60zM500 780l60-60h56l-60 60zM660 780l60-60h56l-60 60z"/>
  </g>
  <g stroke="#9aa08f" stroke-width="5" opacity=".8">
    <path d="M60 700h1540M40 830h1560"/>
  </g>

  <!-- 海侧护栏 -->
  <g stroke="#e8e6da" stroke-width="8" opacity=".9">
    <path d="M700 640h900M700 612h900"/>
    <path d="M760 612v30M900 612v30M1040 612v30M1180 612v30M1320 612v30M1460 612v30"/>
  </g>

  <!-- 绿皮电车（右边驶过） -->
  <g>
    <path d="M1120 120 L1180 260" stroke="#4b4f46" stroke-width="5" fill="none"/>
    <path d="M1108 130 L1150 262M1132 130 L1210 262" stroke="#4b4f46" stroke-width="3" fill="none"/>
    <rect x="900" y="240" width="700" height="330" rx="26" fill="#3f6b4f"/>
    <rect x="900" y="240" width="700" height="56" rx="26" fill="#565a4e"/>
    <rect x="900" y="300" width="700" height="120" fill="#e8e0c6"/>
    <g fill="#cfe8f2" stroke="#33513f" stroke-width="4">
      <rect x="950" y="262" width="110" height="196" rx="12"/>
      <rect x="1100" y="262" width="110" height="196" rx="12"/>
      <rect x="1250" y="262" width="110" height="196" rx="12"/>
      <rect x="1400" y="262" width="110" height="196" rx="12"/>
      <rect x="1540" y="262" width="110" height="196" rx="12"/>
    </g>
    <rect x="940" y="330" width="620" height="6" fill="#33513f" opacity=".5"/>
    <rect x="900" y="510" width="700" height="60" fill="#e8e0c6"/>
    <rect x="920" y="470" width="80" height="34" rx="6" fill="#e5c85a"/>
    <g fill="#2e2e28">
      <circle cx="1000" cy="588" r="26"/>
      <circle cx="1130" cy="588" r="26"/>
      <circle cx="1330" cy="588" r="26"/>
      <circle cx="1460" cy="588" r="26"/>
    </g>
    <rect x="900" y="570" width="700" height="14" fill="#33513f"/>
  </g>

  <!-- 铁路道口标志（黄黑交叉） -->
  <g transform="translate(300 470)">
    <rect x="-8" y="20" width="16" height="220" fill="#7d7f74"/>
    <g transform="rotate(45)">
      <rect x="-64" y="-22" width="128" height="44" rx="8" fill="#e5c85a" stroke="#4b4f46" stroke-width="5"/>
      <g fill="#4b4f46">
        <rect x="-44" y="-22" width="14" height="44"/>
        <rect x="-7" y="-22" width="14" height="44"/>
        <rect x="30" y="-22" width="14" height="44"/>
      </g>
    </g>
    <g transform="rotate(-45)">
      <rect x="-64" y="-22" width="128" height="44" rx="8" fill="#e5c85a" stroke="#4b4f46" stroke-width="5"/>
      <g fill="#4b4f46">
        <rect x="-44" y="-22" width="14" height="44"/>
        <rect x="-7" y="-22" width="14" height="44"/>
        <rect x="30" y="-22" width="14" height="44"/>
      </g>
    </g>
    <circle cx="0" cy="86" r="24" fill="#4b4f46"/>
    <circle cx="-8" cy="80" r="7" fill="#e8e6da"/>
    <circle cx="10" cy="80" r="7" fill="#d9776f"/>
  </g>

  <!-- 黄黑栏杆 -->
  <g transform="translate(430 640)">
    <rect x="0" y="-16" width="640" height="20" fill="#e5c85a" stroke="#4b4f46" stroke-width="4"/>
    <g fill="#4b4f46">
      <rect x="40" y="-18" width="42" height="24"/>
      <rect x="150" y="-18" width="42" height="24"/>
      <rect x="260" y="-18" width="42" height="24"/>
      <rect x="370" y="-18" width="42" height="24"/>
      <rect x="480" y="-18" width="42" height="24"/>
    </g>
  </g>

  <!-- 猫道线 -->
  <g stroke="#3f4238" stroke-width="3" opacity=".85">
    <path d="M0 60h1600M0 96h1600"/>
    <path d="M300 60v36M700 60v36M1100 60v36M1500 60v36"/>
  </g>

  <!-- 前景草 -->
  <g fill="#5e7a4d">
    <ellipse cx="90" cy="898" rx="120" ry="26"/>
    <ellipse cx="1560" cy="898" rx="140" ry="24"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.12" style="mix-blend-mode:multiply"/>
</svg>
